<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tekian IT</title>
<meta name="description" content="Celulares y equipos de red, listos para usar.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='6'%3E%3Cpath d='M19 15v34'/%3E%3Cpath d='M31 17l17 15-17 15'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fff; --ink: #000; --muted: #6b6b6b; --line: #e6e6e6; --tile: #f4f4f4;
    --font: "Sora", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; /* cambiá la fuente acá */
    --pad: clamp(20px, 4vw, 56px);
    --dur: 4s; /* tiempo que dura cada producto destacado */
  }
  * { box-sizing: border-box; margin: 0; }
  html { width: 100%; max-width: 100%; overflow-x: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { position: relative; width: 100%; max-width: 100%; overflow-x: clip; touch-action: pan-y pinch-zoom; }
  body { font-family: var(--font); color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; line-height: 1.5; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  header { display: flex; align-items: center; padding: 18px var(--pad); border-bottom: 1px solid var(--line); }
  .brand { font-weight: 700; font-size: 18px; letter-spacing: .02em; text-decoration: none; display: inline-flex; align-items: baseline; }
  .brand .cursor { display: inline-block; width: .6em; height: .12em; background: var(--ink); margin-left: .25em; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Destacados que rotan */
  .hero { max-width: 1400px; margin: 0 auto; padding: 44px var(--pad) 0; }
  .hero h1 { font-size: clamp(32px, 6vw, 72px); font-weight: 600; line-height: 1.02; letter-spacing: -.04em; max-width: 18ch; }
  .hero p { margin-top: 14px; color: var(--muted); font-size: clamp(14px, 1.4vw, 17px); }
  .slide-skel { grid-area: 1 / 1; height: clamp(240px, 30vw, 380px); border-radius: 6px; background: linear-gradient(90deg, #f1f1f1, #fafafa, #f1f1f1); background-size: 200% 100%; animation: sh 1.4s linear infinite; }
  .rule { width: calc(100% - 2 * var(--pad)); max-width: calc(1400px - 2 * var(--pad)); margin: 40px auto 0; border: 0; border-top: 1px solid var(--line); }
  .stage { max-width: 1400px; margin: 0 auto; padding: 40px var(--pad) 8px; overflow-x: clip; }
  .slides { display: grid; grid-template-columns: minmax(0, 1fr); overflow: hidden; contain: paint; }
  .slide {
    grid-area: 1 / 1; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: clamp(24px, 5vw, 72px); align-items: center;
    opacity: 0; visibility: hidden; transition: opacity .9s ease, visibility .9s;
  }
  .slide.on { opacity: 1; visibility: visible; }
  .slide-text { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; opacity: 0; transform: translateY(16px); transition: opacity .8s .2s, transform .8s .2s cubic-bezier(.2,.7,.2,1); }
  .slide.on .slide-text { opacity: 1; transform: none; }
  .slide h2 { overflow-wrap: anywhere; font-size: clamp(26px, 3.4vw, 44px); font-weight: 600; line-height: 1.08; letter-spacing: -.03em; max-width: 16ch;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .slide .price { font-size: clamp(24px, 3vw, 34px); }
  .cta { margin-top: 8px; background: var(--ink); color: var(--paper); text-decoration: none; font-size: 14px; font-weight: 500; padding: 14px 26px; border-radius: 999px; transition: opacity .2s; }
  .cta:hover { opacity: .8; }
  .slide-media { height: clamp(240px, 30vw, 380px); background: var(--tile); position: relative; border-radius: 6px; overflow: hidden; }
  .slide-media img { position: absolute; inset: 7%; width: 86%; height: 86%; object-fit: contain; mix-blend-mode: multiply; transform: scale(1.07); transition: transform 1.8s cubic-bezier(.2,.7,.2,1); }
  .slide.on .slide-media img { transform: none; }

  .dots { display: flex; gap: 6px; margin-top: 18px; min-width: 0; max-width: 100%; overflow: hidden; }
  .dot { background: none; border: 0; padding: 10px 0; flex: 1 1 0; min-width: 0; max-width: 48px; cursor: pointer; }
  .dot i { display: block; height: 2px; background: var(--line); position: relative; overflow: hidden; }
  .dot i::after { content: ""; position: absolute; inset: 0; background: var(--ink); transform: scaleX(0); transform-origin: left; }
  .dot.on i::after { animation: fill var(--dur) linear forwards; }
  @keyframes fill { to { transform: scaleX(1); } }
  .stage:hover .dot.on i::after, .stage:focus-within .dot.on i::after { animation-play-state: paused; }

  /* Controles */
  .controls { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); margin-top: 24px; }
  .controls-inner { max-width: 1400px; margin: 0 auto; padding: 12px var(--pad); display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
  .field { font: inherit; font-size: 13px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; min-width: 0; }
  input.field { width: min(240px, 100%); }
  .dd { position: relative; }
  .dd-btn { font: inherit; font-size: 13px; display: inline-flex; align-items: center; gap: 12px; cursor: pointer; background: var(--paper); color: var(--ink);
    border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px 8px 18px; transition: border-color .2s; }
  .dd-btn:hover, .dd-btn[aria-expanded="true"] { border-color: var(--ink); }
  .dd-btn svg { width: 11px; height: 11px; transition: transform .2s; }
  .dd-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
  .dd-menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 10; width: 210px; margin: 0; padding: 6px; list-style: none; background: var(--paper);
    border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 16px 40px rgba(0,0,0,.08);
    opacity: 0; visibility: hidden; transform: translateY(-6px); transition: opacity .18s, transform .18s, visibility .18s; }
  .dd.open .dd-menu { opacity: 1; visibility: visible; transform: none; }
  .dd-menu li { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 10px; font-size: 13px; cursor: pointer; }
  .dd-menu li.hl { background: var(--tile); }
  .dd-menu li[aria-selected="true"] { font-weight: 600; }
  .dd-menu li[aria-selected="true"]::after { content: "\2713"; font-size: 12px; }
  .range { display: flex; align-items: center; gap: 12px; font-size: 13px; flex: 1 1 280px; min-width: 0; max-width: 420px; }
  .range label { white-space: nowrap; min-width: 150px; }
  .range input { flex: 1; min-width: 0; accent-color: var(--ink); cursor: pointer; }
  .spacer { flex: 1; }

  /* Grilla */
  main { max-width: 1400px; margin: 0 auto; padding: 28px var(--pad) 72px; overflow-x: clip; }
  .count { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 36px 20px; }
  .card { display: flex; flex-direction: column; text-decoration: none; min-width: 0; }
  .media { position: relative; aspect-ratio: 1 / 1; background: var(--tile); border-radius: 4px; overflow: hidden; }
  .media img { position: absolute; inset: 9%; width: 82%; height: 82%; object-fit: contain; mix-blend-mode: multiply; opacity: 0; transition: opacity .5s, transform .6s cubic-bezier(.2,.7,.2,1); }
  .media img.loaded { opacity: 1; }
  .card:hover .media img.loaded { transform: scale(1.04); }
  .off { position: absolute; top: 12px; left: 12px; background: var(--ink); color: var(--paper); font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
  .info { padding-top: 14px; display: flex; flex-direction: column; gap: 4px; }
  .cond { font-size: 12px; color: var(--muted); }
  .title { font-size: 14px; font-weight: 500; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .prices { display: flex; align-items: baseline; gap: 10px; margin-top: 4px; flex-wrap: wrap; }
  .price { font-size: 19px; font-weight: 600; letter-spacing: -.02em; }
  .was { font-size: 13px; color: var(--muted); text-decoration: line-through; }
  .skel .media, .skel .bar { background: linear-gradient(90deg, #f1f1f1, #fafafa, #f1f1f1); background-size: 200% 100%; animation: sh 1.4s linear infinite; }
  .skel .bar { height: 12px; border-radius: 4px; margin-top: 12px; }
  .skel .bar.s { width: 40%; }
  @keyframes sh { to { background-position: -200% 0; } }
  .msg { padding: 48px 0; }
  .msg h2 { font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
  .msg p { color: var(--muted); margin-top: 6px; }
  footer { border-top: 1px solid var(--line); padding: 28px var(--pad); color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; }

  @media (max-width: 760px) {
    .slide { grid-template-columns: minmax(0, 1fr); gap: 20px; }
    .dd-menu { left: 0; right: auto; }
    .slide-media { order: -1; height: clamp(200px, 58vw, 300px); }
    .slide-skel { height: 420px; }
    .slide h2 { max-width: none; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 14px; }
    .spacer { display: none; }
    input.field { flex: 1 1 100%; width: 100%; }
    .range { max-width: none; flex-basis: 100%; }
  }
  @media (max-width: 380px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header><a class="brand" href="#" aria-label="Tekian IT, inicio">&gt;TEKIAN IT<span class="cursor" aria-hidden="true"></span></a></header>

<section class="hero">
  <h1>Encontrá tus equipos premium.</h1>
  <p>Hardware de calidad listo para usar.</p>
</section>

<hr class="rule">

<section class="stage" id="stage" aria-roledescription="carrusel" aria-label="Productos destacados">
  <div class="slides" id="slides"><div class="slide-skel"></div></div>
  <div class="dots" id="dots"></div>
</section>

<div class="controls">
  <div class="controls-inner">
    <input class="field" id="q" type="search" placeholder="Buscar producto" aria-label="Buscar producto">
    <div class="range"><label for="max" id="maxLabel">Cualquier precio</label><input id="max" type="range"></div>
    <div class="spacer"></div>
    <div class="dd" id="dd">
      <button class="dd-btn" id="ddBtn" aria-haspopup="listbox" aria-expanded="false" aria-label="Ordenar"><span id="ddLabel">Orden original</span>
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4.5l4 4 4-4"/></svg></button>
      <ul class="dd-menu" id="ddMenu" role="listbox" tabindex="-1"></ul>
    </div>
  </div>
</div>

<main>
  <p class="count" id="count" aria-live="polite"></p>
  <div class="grid" id="grid"></div>
</main>

<footer><span>&copy; <span id="year">2026</span> Tekian IT. Todos los derechos reservados.</span><span>Precios y disponibilidad sujetos a MercadoLibre.</span></footer>

<script>
document.getElementById("year").textContent = new Date().getFullYear();
const API_URL = "https://api.tekian.ar/products";

const $ = id => document.getElementById(id);
const grid = $("grid"), count = $("count"), stage = $("stage"), slidesEl = $("slides"), dotsEl = $("dots");
const maxEl = $("max"), maxLabel = $("maxLabel");
const money = new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 });
const state = { all: [], q: "", max: Infinity, ceil: 0, sort: "default" };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const REFURB = /\s*-?\s*(Aceptable|Bueno|Muy bueno|Excelente)?\s*\(Reacondicionado\)\s*$/i;
function normalize(p) {
  const raw = p.titulo || "", m = raw.match(REFURB);
  const price = Number(p.precio), orig = p.precio_original ? Number(p.precio_original) : null;
  const off = orig && orig > price ? Math.round((1 - price / orig) * 100) : 0;
  return {
    title: raw.replace(REFURB, "").replace(/^H\s+/, "").trim(),
    cond: m ? (m[1] ? `Reacondicionado: ${m[1].toLowerCase()}` : "Reacondicionado") : "Nuevo",
    price, orig: off ? orig : null, off, img: p.url_imagen_portada, url: p.url_publicacion
  };
}

const priceHTML = p => `<div class="prices"><span class="price">${money.format(p.price)}</span>${p.orig ? `<span class="was">${money.format(p.orig)}</span>` : ""}</div>`;

function view() {
  const list = state.all.filter(p => p.title.toLowerCase().includes(state.q) && p.price <= state.max);
  if (state.sort === "asc") list.sort((a, b) => a.price - b.price);
  if (state.sort === "desc") list.sort((a, b) => b.price - a.price);
  if (state.sort === "off") list.sort((a, b) => b.off - a.off);
  return list;
}

function render() {
  const list = view();
  count.textContent = (list.length === 1 ? "1 producto" : `${list.length} productos`);
  if (!list.length) { grid.innerHTML = `<div class="msg"><h2>No hay productos con esos filtros</h2><p>Probá con otra búsqueda o un precio más alto.</p></div>`; return; }
  grid.innerHTML = list.map(p => `
    <a class="card" href="${esc(p.url)}" target="_blank" rel="noopener">
      <div class="media">${p.off ? `<span class="off">-${p.off}%</span>` : ""}<img src="${esc(p.img)}" alt="${esc(p.title)}" loading="lazy" decoding="async" referrerpolicy="no-referrer"></div>
      <div class="info"><span class="cond">${p.cond}</span><h3 class="title">${esc(p.title)}</h3>${priceHTML(p)}</div>
    </a>`).join("");
  grid.querySelectorAll("img").forEach(img => { const d = () => img.classList.add("loaded"); img.complete ? d() : (img.onload = img.onerror = d); });
}

// Destacados: cada uno dura --dur y pasa al siguiente con fundido
let cur = 0, items = [];
dotsEl.addEventListener("animationend", e => { if (e.animationName === "fill" && items.length > 1) go((cur + 1) % items.length); });
function go(i) {
  const s = [...slidesEl.children], d = [...dotsEl.children];
  s[cur].classList.remove("on"); s[cur].setAttribute("aria-hidden", "true"); d[cur].classList.remove("on");
  cur = i;
  s[cur].classList.add("on"); s[cur].removeAttribute("aria-hidden");
  void d[cur].offsetWidth; d[cur].classList.add("on"); // reinicia la barra de progreso
}
function buildStage() {
  items = state.all.slice(0, 6);
  if (!items.length) return;
  slidesEl.innerHTML = items.map(p => `
    <article class="slide" aria-hidden="true">
      <div class="slide-text"><span class="cond">${p.cond}</span><h2>${esc(p.title)}</h2>${priceHTML(p)}
        <a class="cta" href="${esc(p.url)}" target="_blank" rel="noopener">Ver más detalles</a></div>
      <div class="slide-media"><img src="${esc(p.img)}" alt="${esc(p.title)}" referrerpolicy="no-referrer"></div>
    </article>`).join("");
  dotsEl.innerHTML = items.map((p, i) => `<button class="dot" aria-label="Ver ${esc(p.title)}"><i></i></button>`).join("");
  dotsEl.hidden = items.length < 2;
  [...dotsEl.children].forEach((b, i) => b.onclick = () => go(i));
  cur = 0;
  const s0 = slidesEl.children[0], d0 = dotsEl.children[0];
  s0.classList.add("on"); s0.removeAttribute("aria-hidden"); d0.classList.add("on");
}

function setupPrice() {
  const prices = state.all.map(p => p.price);
  const lo = Math.floor(Math.min(...prices) / 10000) * 10000;
  state.ceil = Math.ceil(Math.max(...prices) / 10000) * 10000;
  maxEl.min = lo; maxEl.max = state.ceil; maxEl.step = 1000; maxEl.value = state.ceil;
}

function showError() {
  stage.hidden = true; count.textContent = "";
  grid.innerHTML = `<div class="msg"><h2>No pudimos cargar los productos</h2><p>Revisá tu conexión e intentá de nuevo.</p><button class="field" id="retry" style="margin-top:16px;cursor:pointer">Reintentar</button></div>`;
  $("retry").onclick = load;
}

async function load() {
  stage.hidden = false; slidesEl.innerHTML = '<div class="slide-skel"></div>'; dotsEl.innerHTML = "";
  grid.innerHTML = Array.from({ length: 8 }, () => `<div class="card skel"><div class="media"></div><div class="bar"></div><div class="bar s"></div></div>`).join("");
  count.textContent = "Cargando productos";
  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    state.all = data.map(normalize).filter(p => p.title && p.url);
  } catch (e) {
    console.error("No se pudo leer la API. Si el error dice CORS, hay que permitir este origen en api.tekian.ar.", e);
    return showError();
  }
  if (!state.all.length) { stage.hidden = true; count.textContent = ""; grid.innerHTML = `<div class="msg"><h2>Todavía no hay productos</h2><p>Volvé en un rato.</p></div>`; return; }
  setupPrice(); buildStage(); render();
}

$("q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); render(); });
const SORTS = [["default", "Orden original"], ["asc", "Menor precio"], ["desc", "Mayor precio"], ["off", "Mayor descuento"]];
const dd = $("dd"), ddBtn = $("ddBtn"), ddMenu = $("ddMenu");
let hl = 0;
ddMenu.innerHTML = SORTS.map(([v, t]) => `<li role="option" data-v="${v}">${t}</li>`).join("");
const opts = [...ddMenu.children];
function paintDD() { opts.forEach((o, i) => { o.setAttribute("aria-selected", o.dataset.v === state.sort); o.classList.toggle("hl", i === hl); }); }
function openDD(open) {
  dd.classList.toggle("open", open); ddBtn.setAttribute("aria-expanded", open);
  if (open) { hl = Math.max(0, SORTS.findIndex(x => x[0] === state.sort)); paintDD(); }
}
function pick(i) {
  state.sort = SORTS[i][0]; $("ddLabel").textContent = SORTS[i][1]; openDD(false); paintDD(); render(); ddBtn.focus();
}
ddBtn.addEventListener("click", () => openDD(!dd.classList.contains("open")));
opts.forEach((o, i) => { o.onclick = () => pick(i); o.onmouseenter = () => { hl = i; paintDD(); }; });
document.addEventListener("click", e => { if (!dd.contains(e.target)) openDD(false); });
dd.addEventListener("keydown", e => {
  const open = dd.classList.contains("open");
  if (e.key === "Escape") { openDD(false); ddBtn.focus(); }
  else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); if (!open) return openDD(true);
    hl = (hl + (e.key === "ArrowDown" ? 1 : -1) + SORTS.length) % SORTS.length; paintDD();
  } else if ((e.key === "Enter" || e.key === " ") && open) { e.preventDefault(); pick(hl); }
});
paintDD();
maxEl.addEventListener("input", () => {
  const v = Number(maxEl.value), any = v >= state.ceil;
  state.max = any ? Infinity : v;
  maxLabel.textContent = any ? "Cualquier precio" : `Hasta ${money.format(v)}`;
  render();
});

load();
</script>
</body>
</html>
